<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge bulat gelap, identik gaya logomark di onboarding (kotak rounded
       isi accent dengan icon Scissors), di sini dibuat lingkaran penuh
       background gelap (sama dengan warna bg di globals.css) supaya kontras
       tegas di ukuran kecil seperti favicon tab browser. -->
  <rect width="512" height="512" rx="256" fill="#16171b" />

  <!-- Icon gunting, path SVG asli dari lucide-react Scissors (lisensi ISC),
       di-scale dan diposisikan ke tengah kanvas 512x512 dengan padding lebih
       lega supaya proporsinya nyaman dilihat di ukuran kecil (favicon). -->
  <g transform="translate(126, 126) scale(10.8)" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="6" cy="6" r="3" />
    <path d="M8.12 8.12 12 12" />
    <path d="M20 4 8.12 15.88" />
    <circle cx="6" cy="18" r="3" />
    <path d="M14.8 14.8 20 20" />
  </g>
</svg>
