<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge bulat putih dengan icon gunting hitam di tengah. Background
       SENGAJA hanya berupa <circle>, bukan <rect> penuh kanvas — supaya
       area di luar lingkaran benar-benar transparan (PNG di-export
       sebagai RGBA), tidak ada kotak putih/hitam solid menumpuk di
       belakang lingkaran saat dipakai sebagai favicon di tab browser. -->
  <circle cx="256" cy="256" r="256" fill="#ffffff" />

  <!-- Icon gunting, path SVG asli dari lucide-react Scissors (lisensi ISC),
       warna hitam (#16171b, sama dengan warna teks utama di globals.css)
       supaya kontras tegas di atas background putih. -->
  <g transform="translate(126, 126) scale(10.8)" stroke="#16171b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="6" cy="6" r="3" />
    <path d="M8.12 8.12 12 12" />
    <path d="M20 4 8.12 15.88" />
    <circle cx="6" cy="18" r="3" />
    <path d="M14.8 14.8 20 20" />
  </g>
</svg>
